name: Game regression checks

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * *' # nightly: the full-length proofs (WW2_TEST_SLOW=1)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Three shards split the named checks and child files (test-check.js). The last job runs the
        # performance budgets alone, so other test processes cannot eat their time, and the world script.
        part: ['1/3', '2/3', '3/3', 'performance']
    name: game-tests (${{ matrix.part }})
    env:
      WW2_TEST_SLOW: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.part != 'performance'
        run: node test.js
        env:
          WW2_TEST_SHARD: ${{ matrix.part }}
      - if: matrix.part == 'performance'
        run: node test.js && node test-world.js
        env:
          WW2_TEST_ONLY: test-performance.mjs
